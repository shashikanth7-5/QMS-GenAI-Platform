<template>
  <lightning-card title="QMS GenAI" icon-name="standard:case">
    <div class="panel">
      <div class="status-row">
        <span class={connectionClass}>{connectionLabel}</span>
        <span class="muted">{modelLabel}</span>
      </div>

      <template if:true={loading}>
        <div class="loading">
          <lightning-spinner alternative-text="Running QMS GenAI..." size="small"></lightning-spinner>
          <span>Running RCA and CAPA agent pipeline...</span>
        </div>
      </template>

      <template if:true={error}>
        <div class="error">{error}</div>
      </template>

      <template if:true={hasResult}>
        <section class="summary">
          <div>
            <span class="label">Record loaded</span>
            <strong>{recordTitle}</strong>
            <span class="muted">{recordMeta}</span>
          </div>
          <div>
            <span class="label">CAPA draft</span>
            <strong>{capaId}</strong>
            <span class="pill">{reviewState}</span>
          </div>
        </section>

        <section class="block">
          <h3>Root Cause Analysis</h3>
          <p>{rootCause}</p>
          <div class="score-row">
            <span>RCA quality score</span>
            <strong>{rcaQualityScore}</strong>
          </div>
        </section>

        <section class="block">
          <h3>CAPA Draft</h3>
          <dl>
            <dt>Immediate Action</dt>
            <dd>{immediateAction}</dd>
            <dt>Corrective Action</dt>
            <dd>{correctiveAction}</dd>
            <dt>Preventive Action</dt>
            <dd>{preventiveAction}</dd>
            <dt>Effectiveness Check</dt>
            <dd>{effectivenessCheck}</dd>
          </dl>
        </section>

        <section class="metrics">
          <div>
            <span class="label">Risk</span>
            <strong>{riskRating}</strong>
          </div>
          <div>
            <span class="label">Owner</span>
            <strong>{owner}</strong>
          </div>
          <div>
            <span class="label">Closure</span>
            <strong>{closureDays}</strong>
          </div>
        </section>
      </template>

      <template if:false={hasResult}>
        <p class="intro">
          Create an RCA-backed CAPA draft in QMS from this Salesforce Case.
        </p>
      </template>

      <div class="actions">
        <lightning-button
          variant="brand"
          label="Create CAPA with AI"
          title="Create CAPA with AI"
          onclick={handleGenerate}
          disabled={loading}>
        </lightning-button>
        <template if:true={hasQmsUrl}>
          <lightning-button
            variant="neutral"
            label="Open in QMS"
            title="Open in QMS"
            onclick={openInQms}>
          </lightning-button>
        </template>
      </div>
    </div>
  </lightning-card>
</template>
