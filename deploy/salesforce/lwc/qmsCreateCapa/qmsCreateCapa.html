<template>
  <lightning-card title="QMS GenAI" icon-name="standard:case">
    <div class="panel">
      <div class="hero">
        <div>
          <span class="badge badge-ok">Connected</span>
          <h2>{record.title}</h2>
          <p>{recordMeta}</p>
        </div>
        <div class="hero-metric">
          <span>AI model</span>
          <strong>{modelLabel}</strong>
        </div>
      </div>

      <template if:true={isBusy}>
        <div class="loading">
          <lightning-spinner alternative-text="Running QMS GenAI..." size="small"></lightning-spinner>
          <span>{loadingMessage}</span>
        </div>
      </template>

      <template if:true={error}>
        <div class="error">{error}</div>
      </template>

      <section class="toolbar">
        <lightning-combobox
          label="RCA method"
          value={selectedMethod}
          options={methodOptions}
          onchange={handleMethodChange}>
        </lightning-combobox>
        <lightning-button variant="brand" label="Run RCA Analysis" onclick={handleRunRca} disabled={isBusy}></lightning-button>
        <lightning-button variant="neutral" label="Choose Model" onclick={handleLoadModels} disabled={isBusy}></lightning-button>
        <lightning-button variant="brand" label="Generate CAPA Draft" onclick={handleGenerateDraft} disabled={isBusy}></lightning-button>
        <lightning-button variant="neutral" label="Run Agents" onclick={handleRunAgents} disabled={isBusy}></lightning-button>
      </section>

      <section class="rca-layout">
        <div class="block rca-block">
          <div class="block-head">
            <h3>Root Cause Analysis</h3>
            <span class="pill">{rcaScore}</span>
          </div>
          <lightning-textarea
            label="Root cause statement"
            data-field="rootCause"
            value={rootCauseText}
            onchange={handleDraftChange}>
          </lightning-textarea>
          <div class="inline-actions">
            <lightning-button variant="neutral" label="Reassess RCA Score" onclick={handleReassessRca} disabled={isBusy}></lightning-button>
            <template if:true={hasRca}>
              <span class="muted">Score updates automatically after RCA generation; choose a model to improve RCA before CAPA draft.</span>
            </template>
          </div>
        </div>

        <div class="block attachment-block">
          <div class="block-head">
            <h3>Attachments</h3>
            <span class="muted">{attachmentLabel}</span>
          </div>
          <lightning-file-upload
            label="Attach investigation files"
            name="qmsCaseFiles"
            record-id={recordId}
            multiple
            onuploadfinished={handleUploadFinished}>
          </lightning-file-upload>
          <p class="hint">RCA uses record fields plus the latest 15 Salesforce files. Text, CSV, JSON, XML, and log files include snippets; other files are included as traceable file context.</p>
        </div>
      </section>

      <template if:true={showModelModal}>
        <section class="modal-backdrop">
          <div class="modal">
            <div class="modal-head">
              <div>
                <h3>AI Improvement Models</h3>
                <p>Select Model A / B / C to improve and sync RCA into CAPA draft.</p>
              </div>
              <lightning-button-icon icon-name="utility:close" alternative-text="Close" onclick={closeModelModal}></lightning-button-icon>
            </div>
            <div class="models">
              <template for:each={rcaModels} for:item="model">
                <button key={model.index} class="model-card" data-index={model.index} onclick={handleSelectModel}>
                  <strong>{model.label}</strong>
                  <span>{model.meta}</span>
                  <p>{model.summary}</p>
                </button>
              </template>
            </div>
          </div>
        </section>
      </template>

      <section class="block">
        <div class="block-head">
          <h3>Source Record</h3>
          <span class="muted">Loaded from {sourceRecordLabel}</span>
        </div>
        <div class="form-grid compact">
          <lightning-input label="Record ID" data-field="sourceRecordId" value={draft.sourceRecordId} onchange={handleDraftChange}></lightning-input>
          <lightning-input label="Type" data-field="sourceRecordType" value={draft.sourceRecordType} onchange={handleDraftChange}></lightning-input>
          <lightning-input label="Priority" data-field="sourcePriority" value={draft.sourcePriority} onchange={handleDraftChange}></lightning-input>
          <lightning-input label="Site" data-field="sourceSite" value={draft.sourceSite} onchange={handleDraftChange}></lightning-input>
          <lightning-input class="full-width" label="Issue title" data-field="sourceTitle" value={draft.sourceTitle} onchange={handleDraftChange}></lightning-input>
        </div>
      </section>

      <section class="block">
        <div class="block-head">
          <h3>CAPA Eligibility & Impact Assessment</h3>
          <span class="pill">{capaStatus}</span>
        </div>
        <div class="form-grid compact">
          <lightning-combobox label="Impact scope *" data-field="impactScope" value={draft.impactScope} options={impactOptions} onchange={handleDraftChange}></lightning-combobox>
          <lightning-combobox label="Risk level *" data-field="riskRating" value={draft.riskRating} options={riskOptions} onchange={handleDraftChange}></lightning-combobox>
          <lightning-combobox label="Repeat event" data-field="repeatEvent" value={draft.repeatEvent} options={yesNoOptions} onchange={handleDraftChange}></lightning-combobox>
          <lightning-combobox label="Supplier related" data-field="supplierRelated" value={draft.supplierRelated} options={yesNoOptions} onchange={handleDraftChange}></lightning-combobox>
          <lightning-combobox label="Authority notification required" data-field="authorityNotificationRequired" value={draft.authorityNotificationRequired} options={yesNoOptions} onchange={handleDraftChange}></lightning-combobox>
          <lightning-combobox label="Effectiveness check required" data-field="effectivenessCheckRequired" value={draft.effectivenessCheckRequired} options={yesNoOptions} onchange={handleDraftChange}></lightning-combobox>
          <lightning-input label="Affected persons / functions" data-field="affectedFunctions" value={draft.affectedFunctions} onchange={handleDraftChange}></lightning-input>
          <lightning-textarea class="full-width" label="Impact assessment detail *" data-field="impactAssessmentDetail" value={draft.impactAssessmentDetail} onchange={handleDraftChange}></lightning-textarea>
        </div>
      </section>

      <section class="block">
        <div class="block-head">
          <h3>CAPA Draft</h3>
          <span class="muted">AI generated and editable</span>
        </div>
        <div class="form-grid">
          <lightning-textarea label="Immediate / containment action" data-field="immediateAction" value={draft.immediateAction} onchange={handleDraftChange}></lightning-textarea>
          <lightning-textarea label="Corrective action" data-field="correctiveAction" value={draft.correctiveAction} onchange={handleDraftChange}></lightning-textarea>
          <lightning-textarea label="Preventive action" data-field="preventiveAction" value={draft.preventiveAction} onchange={handleDraftChange}></lightning-textarea>
          <lightning-textarea label="Effectiveness check" data-field="effectivenessCheck" value={draft.effectivenessCheck} onchange={handleDraftChange}></lightning-textarea>
          <lightning-input label="CAPA owner" data-field="capaOwner" value={draft.capaOwner} onchange={handleDraftChange}></lightning-input>
          <lightning-input type="number" label="Estimated closure days" data-field="estimatedClosureDays" value={closureDays} onchange={handleDraftChange}></lightning-input>
          <lightning-input type="date" label="Target closure date" data-field="targetClosureDate" value={draft.targetClosureDate} onchange={handleDraftChange}></lightning-input>
          <lightning-textarea label="Regulatory references *" data-field="regulatoryRef" value={draft.regulatoryRef} onchange={handleDraftChange}></lightning-textarea>
          <lightning-textarea label="Supporting documents" data-field="supportingDocuments" value={draft.supportingDocuments} onchange={handleDraftChange}></lightning-textarea>
          <lightning-textarea label="Additional notes" data-field="additionalNotes" value={draft.additionalNotes} onchange={handleDraftChange}></lightning-textarea>
          <lightning-textarea label="Agent / AI generated detail" data-field="agentSummary" value={draft.agentSummary} onchange={handleDraftChange}></lightning-textarea>
        </div>
      </section>

      <section class="metrics">
        <div>
          <span>Time saving vs manual</span>
          <strong>{timeSavedLabel}</strong>
        </div>
        <div>
          <span>CAPA destination</span>
          <strong>QMS + Salesforce related record</strong>
        </div>
      </section>

      <div class="actions">
        <lightning-button variant="brand" label="Save CAPA" onclick={handleSaveDraft} disabled={isBusy}></lightning-button>
        <lightning-button variant="neutral" label="Refresh Related CAPAs" onclick={handleRefreshRelated}></lightning-button>
        <lightning-button variant="neutral" label="Open in QMS" onclick={openInQms}></lightning-button>
      </div>

      <section class="block">
        <div class="block-head">
          <h3>Related CAPA Records</h3>
          <span class="muted">Linked to this Salesforce record</span>
        </div>
        <template if:true={hasRelatedCapas}>
          <div class="related-list">
            <template for:each={relatedCapas} for:item="capa">
              <article key={capa.id} class="capa-summary">
                <div class="capa-summary-head">
                  <div>
                    <h4>{capa.name}</h4>
                    <p>{capa.qmsCapaId} | {capa.status} | {capa.risk} | {capa.owner}</p>
                  </div>
                  <div class="capa-actions">
                    <template if:true={capa.isReadyForSubmission}>
                      <lightning-button variant="brand" label="Submit for Approval" data-id={capa.id} onclick={handleSubmitForApproval} disabled={isBusy}></lightning-button>
                    </template>
                    <template if:true={capa.isPendingApproval}>
                      <span class="decision-status pending"><lightning-icon icon-name="utility:clock" size="xx-small" alternative-text="Pending approval"></lightning-icon>Pending Salesforce approval</span>
                    </template>
                    <template if:true={capa.isApproved}>
                      <span class="decision-status approved"><lightning-icon icon-name="utility:success" size="xx-small" alternative-text="Approved"></lightning-icon>Approved in Salesforce</span>
                    </template>
                    <template if:true={capa.isReturnedForCorrection}>
                      <span class="decision-status correction"><lightning-icon icon-name="utility:warning" size="xx-small" alternative-text="Changes requested"></lightning-icon>Changes requested</span>
                    </template>
                  </div>
                </div>
                <div class="detail-grid">
                  <div><span>Source</span><strong>{capa.sourceRecordTitle}</strong><p>{capa.sourceRecordId} | {capa.sourceRecordType} | {capa.sector}</p></div>
                  <div><span>Impact / Risk</span><strong>{capa.impactScope}</strong><p>{capa.risk}; repeat: {capa.repeatEvent}; supplier: {capa.supplierRelated}</p></div>
                  <div><span>Authority / Effectiveness Required</span><strong>{capa.authorityNotificationRequired}</strong><p>Effectiveness required: {capa.effectivenessCheckRequired}</p></div>
                  <div><span>Timeline</span><strong>{capa.targetClosureDate}</strong><p>{capa.closureDays} day(s)</p></div>
                </div>
                <div class="field-stack">
                  <section><span>Root Cause</span><p>{capa.rootCause}</p></section>
                  <section><span>Immediate / Containment Action</span><p>{capa.immediateAction}</p></section>
                  <section><span>Corrective Action</span><p>{capa.correctiveAction}</p></section>
                  <section><span>Preventive Action</span><p>{capa.preventiveAction}</p></section>
                  <section><span>Effectiveness Check</span><p>{capa.effectivenessCheck}</p></section>
                  <section><span>Regulatory References</span><p>{capa.regulatoryReferences}</p></section>
                  <section><span>Impact Assessment Detail</span><p>{capa.impactAssessmentDetail}</p></section>
                  <section><span>Supporting Documents</span><p>{capa.supportingDocuments}</p></section>
                  <section><span>AI / Agent Details</span><p>{capa.llmProvider} {capa.llmModel}</p><p>{capa.agentSummary}</p></section>
                </div>
              </article>
            </template>
          </div>
        </template>
        <template if:false={hasRelatedCapas}>
          <p class="empty">No CAPAs linked yet. Generate and save a draft from this panel.</p>
        </template>
      </section>

    </div>
  </lightning-card>
</template>
